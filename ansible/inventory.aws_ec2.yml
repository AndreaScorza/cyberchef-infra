plugin: amazon.aws.aws_ec2
regions:
  - eu-north-1
filters:
  tag:Project: cyberchef
  instance-state-name: running
hostnames:
  - instance-id
groups:
  cyberchef: true
compose:
  ansible_connection: "'community.aws.aws_ssm'"
  ansible_aws_ssm_region: "'eu-north-1'"
  ansible_aws_ssm_bucket_name: "'cyberchef-ssm-transfer-456203800141'"
  ansible_aws_ssm_timeout: "1800"
  ansible_python_interpreter: "'/usr/bin/python3'"
