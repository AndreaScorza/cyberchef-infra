name: Deploy Terraform

on:
  workflow_call:
    inputs:
      action:
        description: 'Terraform action to run (plan or apply)'
        type: string
        required: true
    secrets:
      aws_role_arn:
        required: true
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      # Manual (workflow_dispatch) runs have no `action` input, so default to apply.
      ACTION: ${{ inputs.action || 'apply' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_arn || secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        if: env.ACTION == 'plan'
        id: plan
        working-directory: terraform
        run: terraform plan -no-color

      - name: Post Plan as PR comment
        if: env.ACTION == 'plan' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📖
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: env.ACTION == 'apply'
        working-directory: terraform
        run: terraform apply -auto-approve