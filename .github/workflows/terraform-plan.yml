name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan
    uses: ./.github/workflows/terraform.yml
    with:
      action: plan
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
