name: Deploy CyberChef

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_terraform:
        description: 'Run Terraform'
        type: boolean
        default: true
      run_ansible:
        description: 'Run Ansible'
        type: boolean
        default: true

jobs:
  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/terraform.yml
    with:
      action: plan
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

  terraform-apply:
    name: Terraform Apply
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_terraform)
    uses: ./.github/workflows/terraform.yml
    with:
      action: apply
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

  ansible:
    name: Ansible Deploy
    needs: terraform-apply
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_ansible)
    uses: ./.github/workflows/ansible.yml
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}