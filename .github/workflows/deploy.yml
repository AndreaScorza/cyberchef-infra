name: Deploy All Services

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform-apply:
    name: Terraform Apply
    uses: ./.github/workflows/terraform.yml
    with:
      action: apply
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

  ansible:
    name: Ansible Deploy
    needs: terraform-apply
    uses: ./.github/workflows/ansible.yml
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
