name: Deploy CyberChef

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/terraform.yml
    with:
      action: plan
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push'
    uses: ./.github/workflows/terraform.yml
    with:
      action: apply
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

  ansible:
    name: Ansible Deploy
    needs: terraform-apply
    if: github.event_name == 'push'
    uses: ./.github/workflows/ansible.yml
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}